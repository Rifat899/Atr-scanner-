name: Update Binance Top 100 Candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Build Binance candidate list
        run: python update_watchlist.py

      - name: Save candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binance_top100_candidates.json
          git diff --cached --quiet || git commit -m "Update Binance top 100 candidates"
          git pull --rebase origin main
          git push
