name: Update Crypto Watchlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Update watchlist
        run: python update_watchlist.py

      - name: Save updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git diff --cached --quiet || git commit -m "Update crypto watchlist"
          git push
